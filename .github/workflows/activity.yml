name: refresh-upstream-activity
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_activity.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "hr1juldey"
          git config user.email "phant0mhriju@gmail.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "activity: refresh upstream PR table"
            git push
          fi
